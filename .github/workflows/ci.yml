name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running production deploy; superseded PR runs can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: src/routeTree.gen.ts is gitignored and generated by the router plugin, and tsc needs it.
      # Env is scoped to this step so tests never see the production DB or the R2 base URL.
      - run: pnpm build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_PICTURES_BASE_URL: ${{ vars.VITE_PICTURES_BASE_URL }}
          # Pictures live in R2, so the optimized variants cannot be detected from public/
          PLAYASMURCIA_OPTIMIZED_IMAGES: 'true'
          # The sitemap step queries the database
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: pnpm check

      # Tests compare data/*.json with the DB, so seed a fresh local one from the JSON
      - name: Seed test database
        env:
          DATABASE_URL: file:./local.db
        run: |
          pnpm drizzle-kit push --force
          pnpm tsx scripts/migrate-to-database.ts

      - run: pnpm test
        env:
          DATABASE_URL: file:./local.db

      # Same job as the build: wrangler reads the config the Cloudflare Vite plugin wrote to .wrangler/deploy/
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
